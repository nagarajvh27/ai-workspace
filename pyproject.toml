[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-workspace-v0"
version = "0.1.0"
description = "A Python backend foundation for document workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "psycopg[binary]>=3.3,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_workspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
