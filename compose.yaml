services:
  app:
    build:
      context: .
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-ai_workspace}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ai_workspace}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-ai_workspace}"
      POSTGRES_USER: "${POSTGRES_USER:-ai_workspace}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before running Docker Compose}"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql/documents_schema.sql:/docker-entrypoint-initdb.d/001-documents-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
